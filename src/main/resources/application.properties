spring.application.name=login-simples

# Banco H2 em arquivo (os dados persistem na pasta ./data)
spring.datasource.url=jdbc:h2:file:./data/logindb
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update

# JWT: em produção defina a variável de ambiente JWT_SECRET (mínimo 32 caracteres)
app.jwt.secret=${JWT_SECRET:chave-de-desenvolvimento-troque-em-producao-123456}
app.jwt.expiration-minutes=30
